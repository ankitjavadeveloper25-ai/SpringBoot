# ====================================================================
# WINTER ARC PRO — LOCAL POSTGRESQL DEVELOPMENT (SPRING_PROFILES_ACTIVE=local)
# ====================================================================

server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/winterarcdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
